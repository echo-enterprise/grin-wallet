[package]
name = "echo_wallet"
version = "5.4.0-alpha.1"
authors = ["Grin Developers <mimblewimble@lists.launchpad.net>"]
description = "Simple, private and scalable cryptocurrency implementation based on the MimbleWimble chain format."
license = "Apache-2.0"
repository = "https://github.com/echo-enterprise/echo-wallet"
keywords = [ "crypto", "grin", "mimblewimble" ]
readme = "README.md"
exclude = ["**/*.grin", "**/*.grin2"]
build = "src/build/build.rs"
edition = "2018"

[[bin]]
name = "echo-wallet"
path = "src/bin/echo-wallet.rs"

[workspace]
members = ["api", "config", "controller", "impls", "libwallet", "util", "i2p_router"]
exclude = ["integration"]

[dependencies]
clap = { version = "2.33", features = ["yaml"] }
rpassword = "4.0"
yaml-rust = "0.3.5"
thiserror = "1"
prettytable-rs = "0.10"
log = "0.4"
linefeed = "0.6"
semver = "0.10"
rustyline = "6"
lazy_static = "1"

tokio.workspace = true
anyhow.workspace = true
yosemite.workspace = true
futures.workspace = true

echo_wallet_api = { path = "./api", version = "5.4.0-alpha.1" }
echo_wallet_impls = { path = "./impls", version = "5.4.0-alpha.1" }
echo_wallet_libwallet = { path = "./libwallet", version = "5.4.0-alpha.1" }
echo_wallet_controller = { path = "./controller", version = "5.4.0-alpha.1" }
echo_wallet_config = { path = "./config", version = "5.4.0-alpha.1" }
echo_wallet_util = { path = "./util", version = "5.4.0-alpha.1" }
i2p_router = { path="./i2p_router" }


##### Grin Imports

# For bleeding edge
# echo_core = { git = "https://github.com/mimblewimble/grin", branch = "master" }
# echo_keychain = { git = "https://github.com/mimblewimble/grin", branch = "master" }
# echo_util = { git = "https://github.com/mimblewimble/grin", branch = "master" }
# echo_api = { git = "https://github.com/mimblewimble/grin", branch = "master" }

# For local testing
echo_core = { path = "../echo/core"}
echo_keychain = { path = "../echo/keychain"}
echo_util = { path = "../echo/util"}
echo_api = { path = "../echo/api"}

###### 

[build-dependencies]
built = { version = "0.7", features = ["git2"]}

[dev-dependencies]
url = "2.1"
serde = "1"
serde_derive = "1"
serde_json = "1"
remove_dir_all = "0.7"
easy-jsonrpc-mw = "0.5.4"


[workspace.dependencies]
anyhow = "1.0.98"
ed25519-dalek = { version = "2.1.1", default-features = false }
flate2 = "1.1.2"
futures = "0.3.31"
nom = { version = "7.1.3", default-features = false }
parking_lot = "0.12.4"
rand = "0.8.5"
rand_core = { version = "0.6.3", default-features = false }
reqwest = { version = "0.12.20", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
tempfile = "3.20.0"
tokio-util = { version = "0.7.15", features = ["compat"] }
tokio = { version = "1.45.1", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["chrono", "env-filter", "time"] }
tracing = { version = "0.1.41", default-features = false }
x25519-dalek = { version = "2.0.1", default-features = false }
yosemite = { version = "0.5.0", features = ["async-extra"] }
emissary-core = { git = "https://github.com/echo-enterprise/emissary", branch = "master", features = ["std"] }
emissary-util = { git = "https://github.com/echo-enterprise/emissary", branch = "master", features = ["tokio"] }
